[project]
name = "solareclipseworkbench"
version = "1.10.7"

description = "Tools to photograph solar eclipses"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Sara Regibo", email = "sararegibo@gmail.com" },
    { name = "Wim De Meester", email = "deepskywim@gmail.com" },
]
keywords = ["astronomy", "photography", "solar eclipse"]
requires-python = ">=3.11"
dependencies = [
    "astropy==8.0.0",
    "geopandas==1.1.3",
    "matplotlib==3.11.0",
    "gphoto2==2.6.3",
    "apscheduler==3.11.2",
    "geodatasets==2026.5.1",
    "jplephem==2.24",
    "skyfield==1.54",
    "skyfield-data==7.0.0",
    "timezonefinder==8.2.4",
    "playsound3==3.3.1",
    "pyqt6==6.11.0",
    "pytz==2026.2",
    "pyserial==3.5",
    "pynmea2==1.19.0",
    "geopy==2.4.1",
    "astropy-iers-data==0.2026.6.22.1.23.34",
    "requests==2.34.2",
    "qrcode==8.2",
]

[project.urls]
Repository = "https://github.com/AstroWimSara/SolarEclipseWorkbench"

[project.scripts]
sew = "solareclipseworkbench.gui:main"
sew_wizard = "solareclipseworkbench.wizard:main"
sew_hardware = "solareclipseworkbench.hardware_console:main"

# Mount drivers. Built-in drivers are found by scanning the mounts package; this
# group lets a driver ship in its own package instead of being vendored here.
[project.entry-points."solareclipseworkbench.mount_drivers"]
onstepx = "solareclipseworkbench.mounts.onstepx:OnStepXMount"
simulator = "solareclipseworkbench.mounts.simulator:SimulatorMount"

# Relay backends. Built-in backends register themselves on import; this group
# lets a board type ship in its own package. A backend supplies only "close a
# contact" and "open a contact" — the shutter timing and the release-on-exit
# guarantees stay in RelayTrigger, so they are never reimplemented per board.
[project.entry-points."solareclipseworkbench.relay_backends"]
lcus = "solareclipseworkbench.relay_trigger:LcusSerialBackend"
dsd = "solareclipseworkbench.relay_trigger:DsdSerialBackend"
numato = "solareclipseworkbench.relay_trigger:NumatoSerialBackend"
hid = "solareclipseworkbench.relay_trigger:HidRelayBackend"
simulated = "solareclipseworkbench.relay_trigger:SimulatedBackend"

[project.optional-dependencies]
# HID relay boards (dcttech/usbrelay style, 16c0:05df). 'hidapi' ships the
# shared library in its wheel, so no separate system package is needed; the
# similarly named 'hid' package provides the same import but does not.
hid = ["hidapi>=0.14"]

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"solareclipseworkbench" = [
    "sound/**",
    "example_scripts/**",
    "img/**",
    "*.bsp",
    "*.csv",
]

