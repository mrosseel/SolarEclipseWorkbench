<!doctype html>
<html><head><meta charset="utf-8"><title>timing clock</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;
    font-family:"SF Mono",Menlo,monospace;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1.2vh}
  #clock{font-size:11vw;font-weight:700;letter-spacing:-0.02em;line-height:1}
  #ms{font-size:15vw;font-weight:700;line-height:1;color:#0f0}
  .row{width:94vw}
  .label{font-size:1.6vw;color:#888;margin:0.4vh 0 0.2vh}
  .bar{width:100%;height:7vh;background:#111;position:relative;
    border:1px solid #333}
  .dot{position:absolute;top:0;bottom:0;width:0.7vw}
  .tick{position:absolute;top:0;bottom:0;width:1px;background:#444}
  .tick.major{background:#777;width:2px}
  .ticklabel{position:absolute;top:100%;font-size:1.4vw;color:#666;
    transform:translateX(-50%)}
  #b1 .dot{background:#0f0}
  #b2 .dot{background:#ff0}
  #b3 .dot{background:#f44}
</style></head><body><div id="wrap">
  <div id="clock">--:--:--</div><div id="ms">---</div>
  <div class="row"><div class="label">1 s sweep — position = milliseconds; each dash of a streak = one screen refresh</div>
    <div class="bar" id="b1"><div class="dot"></div></div></div>
  <div class="row"><div class="label">10 s sweep — which second</div>
    <div class="bar" id="b2"><div class="dot"></div></div></div>
  <div class="row"><div class="label">60 s sweep — which ten seconds</div>
    <div class="bar" id="b3"><div class="dot"></div></div></div>
</div><script>
  function buildTicks(bar, count, majorEvery, labelValue) {
    for (let i = 0; i <= count; i++) {
      const tick = document.createElement('div');
      tick.className = 'tick' + (i % majorEvery === 0 ? ' major' : '');
      tick.style.left = (i / count * 100) + '%';
      bar.appendChild(tick);
      if (i % majorEvery === 0 && i < count) {
        const lab = document.createElement('div');
        lab.className = 'ticklabel';
        lab.style.left = (i / count * 100) + '%';
        lab.textContent = labelValue(i);
        bar.appendChild(lab);
      }
    }
  }
  const b1 = document.getElementById('b1'), b2 = document.getElementById('b2'),
        b3 = document.getElementById('b3');
  buildTicks(b1, 10, 1, i => i * 100);        // every 100 ms, labelled
  buildTicks(b2, 10, 1, i => i);              // every second, labelled
  buildTicks(b3, 60, 10, i => i);             // every second, tens labelled
  const d1 = b1.querySelector('.dot'), d2 = b2.querySelector('.dot'),
        d3 = b3.querySelector('.dot');
  const clock = document.getElementById('clock');
  const ms = document.getElementById('ms');
  function pad(n, w) { return String(n).padStart(w, '0'); }
  function tick() {
    const now = new Date(), t = now.getTime();
    clock.textContent = pad(now.getHours(),2) + ':' + pad(now.getMinutes(),2)
      + ':' + pad(now.getSeconds(),2);
    ms.textContent = '.' + pad(now.getMilliseconds(), 3);
    d1.style.left = (t % 1000) / 1000 * 100 + '%';
    d2.style.left = (t % 10000) / 10000 * 100 + '%';
    d3.style.left = (t % 60000) / 60000 * 100 + '%';
    requestAnimationFrame(tick);
  }
  tick();
</script></body></html>
